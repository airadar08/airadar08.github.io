<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>AI Radar</title>
<meta name="robots" content="noindex">
<meta name="description" content="AI Radar: ask anything about AI, get a short answer with sources, and save repos and resources to your library.">
<meta name="theme-color" content="#0a0c0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI Radar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* App shell: header, one scrolling view (Chat or Library), bottom tab bar. Dark + mint, same tokens as the site. */
:root{
  --bg:#0a0c0b; --card:#111412; --card-2:#161a17; --line:#1f2521; --line-2:#2a322d;
  --ink:#eef1ee; --muted:#9aa39c; --dim:#6f786f;
  --mint:#34c98a; --mint-ink:#6fdcaa; --mint-soft:#12271e; --btn-ink:#03120b;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  --tabs-h:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(70% 35% at 50% 0%,rgba(52,201,138,.10),transparent 70%) no-repeat,var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px;border-radius:8px}
.app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}

/* header */
.top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:rgba(10,12,11,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.top img{width:34px;height:34px;border-radius:50%}
.top .name{font-weight:700;font-size:18px;letter-spacing:-.03em}
.top .sub{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.top .sub i{width:6px;height:6px;border-radius:50%;background:var(--mint)}
.top .sp{flex:1}
.pill-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.pill-btn.mint{background:var(--mint);color:var(--btn-ink);border-color:var(--mint)}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line-2);background:var(--card);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:18px;height:18px}

/* views */
.view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.chat-view{display:flex;flex-direction:column}
.log{display:flex;flex-direction:column;gap:14px;padding-bottom:8px}

/* welcome */
.hello{padding:28px 4px 10px;display:flex;flex-direction:column;gap:12px}
.hello h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,8vw,48px);line-height:1.02;letter-spacing:-.015em;margin:0}
.hello h1 em{color:var(--mint);font-style:italic}
.hello p{margin:0;color:var(--muted);max-width:48ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-top:6px}
.chip{border:1px solid var(--line-2);background:var(--card);border-radius:999px;padding:8px 13px;font-size:13.5px;cursor:pointer;text-align:left;transition:border-color .2s}
.chip:hover{border-color:var(--mint)}

/* messages */
.msg{max-width:92%;animation:in .35s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.msg.me{align-self:flex-end;background:var(--mint);color:var(--btn-ink);padding:10px 14px;border-radius:18px 18px 6px 18px;font-weight:500;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.bot{align-self:stretch;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:14px;display:flex;flex-direction:column;gap:12px}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--mint-ink)}
.who img{width:20px;height:20px;border-radius:50%}
.who em{font:500 10.5px var(--mono);font-style:normal;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.answer{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.answer a{color:var(--mint-ink)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.mini-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.mini-btn svg{width:14px;height:14px}
.mini-btn.on{background:var(--mint-soft);border-color:#1f4434;color:var(--mint-ink)}
.group-h{font:500 10.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin-top:2px}
.cards{display:flex;flex-direction:column;gap:8px}
.src{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--card-2);text-decoration:none}
.src .thumb{flex:none;width:42px;height:52px;border-radius:8px;object-fit:cover;background:#1b201c}
.src .num{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--mint-soft);color:var(--mint-ink);font:700 12px var(--sans)}
.src .c{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.src .k{font:500 10px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--mint-ink)}
.src b{font-weight:600;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.src .d{font-size:12.5px;line-height:1.4;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.src .m{font-size:11.5px;color:var(--dim)}
.save{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid var(--line-2);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--muted);transition:background .2s,color .2s,border-color .2s}
.save svg{width:16px;height:16px}
.save.on{background:var(--mint-soft);border-color:#1f4434;color:var(--mint)}
.save.on svg path{fill:currentColor}
.typing{display:inline-flex;gap:5px;padding:6px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.3;transform:none}40%{opacity:1;transform:translateY(-3px)}}
.note{font-size:12.5px;color:var(--muted)}
.err{color:#f0a58a}

/* composer */
.composer{padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:rgba(10,12,11,.92);display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line-2);border-radius:16px;background:var(--card);padding:11px 14px;font:15px/1.4 var(--sans);color:var(--ink);max-height:130px}
.composer textarea:focus{outline:none;border-color:var(--mint)}
.send{flex:none;width:46px;height:46px;border-radius:14px;border:0;background:var(--mint);color:var(--btn-ink);display:grid;place-items:center;cursor:pointer}
.send:disabled{opacity:.4}
.send svg{width:18px;height:18px}

/* library */
.lib-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px 2px 14px}
.lib-head h1{font-family:var(--serif);font-weight:400;font-size:clamp(32px,7vw,44px);line-height:1;margin:0}
.lib-head .count{color:var(--muted);font-size:13px}
.search{position:relative}
.search input{width:100%;border:1px solid var(--line-2);background:var(--card);border-radius:14px;padding:12px 14px 12px 40px;color:var(--ink)}
.search input:focus{outline:none;border-color:var(--mint)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--dim)}
.filters{display:flex;flex-direction:column;gap:10px;padding:12px 0 6px}
.frow{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.frow::-webkit-scrollbar{display:none}
.f{flex:none;border:1px solid var(--line-2);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.f.on{background:var(--mint);color:var(--btn-ink);border-color:var(--mint)}
.f.tag.on{background:var(--mint-soft);color:var(--mint-ink);border-color:#1f4434}
.custom{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.custom input{border:1px solid var(--line-2);background:var(--card);border-radius:10px;padding:7px 9px;color:var(--ink)}
.items{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.item{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:13px 14px;display:flex;flex-direction:column;gap:7px}
.item .t{display:flex;gap:8px;align-items:flex-start}
.item .t b{flex:1;font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.type{flex:none;font:500 10px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--mint-ink);background:var(--mint-soft);padding:4px 8px;border-radius:999px}
.item .meta{font-size:12px;color:var(--dim);display:flex;flex-wrap:wrap;gap:4px 10px}
.item .q{font-size:12.5px;color:var(--muted)}
.item .body{font-size:13.5px;color:#c7cec9;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.item .body.open{display:block}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tags span{font-size:11px;color:var(--muted);border:1px solid var(--line-2);border-radius:999px;padding:2px 8px}
.item .acts{display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:40px 10px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{font-family:var(--serif);font-weight:400;font-size:26px;color:var(--ink)}

/* tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);background:rgba(10,12,11,.95);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{height:var(--tabs-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:var(--dim);font-size:11.5px;font-weight:600;cursor:pointer;position:relative}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--mint)}
.badge{position:absolute;top:8px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--mint);color:var(--btn-ink);font-size:10.5px;font-weight:700;display:grid;place-items:center}

/* toast + install hint */
.toast{position:fixed;left:50%;bottom:calc(var(--tabs-h) + 84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--ease);z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
.ios-hint{margin:10px 0 0;padding:10px 12px;border:1px dashed var(--line-2);border-radius:12px;font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <img src="../assets/logo.svg" alt="" width="34" height="34">
    <div>
      <div class="name">AI Radar</div>
      <div class="sub"><i></i>AI questions only · beta</div>
    </div>
    <div class="sp"></div>
    <button class="pill-btn mint" id="install" type="button" hidden>Install app</button>
    <button class="icon-btn" id="clear" type="button" aria-label="New chat" title="New chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
  </header>

  <main class="view chat-view" id="view-chat">
    <section class="hello" id="hello">
      <h1>Ask anything about <em>AI</em>.</h1>
      <p>Short answers with sources. Save repos, articles and answers to your library, then ask for them again any time, even a year later.</p>
      <div class="chips" id="starter">
        <button class="chip" type="button">Top 5 trending repos for audio</button>
        <button class="chip" type="button">Explain RAG simply</button>
        <button class="chip" type="button">Best AI tools for spreadsheets</button>
        <button class="chip" type="button">How do AI agents work?</button>
        <button class="chip" type="button">What did I save about agents?</button>
      </div>
      <p class="ios-hint" id="ios-hint" hidden>To install on iPhone: tap the Share button in Safari, then "Add to Home Screen".</p>
    </section>
    <div class="log" id="log" aria-live="polite"></div>
  </main>

  <main class="view" id="view-lib" hidden>
    <div class="lib-head"><h1>Library</h1><span class="count" id="lib-count"></span></div>
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input id="lib-q" type="search" placeholder="Search your saved items" aria-label="Search your saved items" autocomplete="off"></label>
    <div class="filters">
      <div class="frow" id="f-type" role="group" aria-label="Type"></div>
      <div class="frow" id="f-date" role="group" aria-label="Date saved"></div>
      <div class="custom" id="f-custom" hidden><label>From <input type="date" id="d-from"></label><label>To <input type="date" id="d-to"></label></div>
      <div class="frow" id="f-tag" role="group" aria-label="Topic"></div>
    </div>
    <div class="items" id="items"></div>
  </main>

  <form class="composer" id="composer">
    <label for="q" style="position:absolute;left:-9999px">Ask about AI</label>
    <textarea id="q" rows="1" maxlength="500" placeholder="Ask about AI models, tools, repos…" enterkeyhint="send"></textarea>
    <button class="send" type="submit" id="send" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button>
  </form>

  <nav class="tabs" aria-label="Sections">
    <button class="tab on" type="button" data-tab="chat" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>Chat</button>
    <button class="tab" type="button" data-tab="lib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>Library<span class="badge" id="badge" hidden></span></button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="app.js?v=2"></script>
</body>
</html>
