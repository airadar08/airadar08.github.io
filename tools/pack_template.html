<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE_TAG}}</title>
<meta name="description" content="{{DESC}}">
<meta property="og:title" content="{{TITLE_TAG}}">
<meta property="og:description" content="{{DESC}}">
<meta name="theme-color" content="#0a0c0b">
<link rel="icon" href="{{R}}assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="{{R}}assets/site.css?v=6">
<style>
.page-head{padding-block:48px 8px;display:grid;gap:14px;justify-items:start}
.page-head h1{font-size:clamp(36px,5.4vw,60px);font-weight:800;line-height:1.02}
.page-head h1 em{font-style:normal;color:var(--mint)}
.page-head p{margin:0;color:var(--muted);font-size:18px;max-width:56ch}
.crumb{font-size:14px;color:var(--muted);text-decoration:none}.crumb:hover{color:var(--mint-ink)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.page-head>*{animation:rise .7s var(--ease) both}.page-head>*:nth-child(2){animation-delay:.06s}.page-head>*:nth-child(3){animation-delay:.12s}.page-head>*:nth-child(4){animation-delay:.18s}
.how{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 0;padding:0;list-style:none}
.how li{font-size:13px;font-weight:500;padding:5px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
mark{background:color-mix(in srgb,var(--mint) 18%,transparent);color:inherit;border-radius:4px;padding:0 3px;font-family:var(--mono);font-size:.9em}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px;padding-block:28px 72px;align-items:start}
nav#nav{position:sticky;top:84px;display:grid;gap:2px}
nav#nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:10px;color:var(--muted);font-size:15px;font-weight:500;display:flex;justify-content:space-between;gap:8px;transition:background .2s,color .2s}
nav#nav button:hover{background:var(--bg-2);color:var(--fg)}
nav#nav button[aria-pressed="true"]{background:var(--mint-soft);color:var(--mint-ink)}
nav#nav button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
@media (max-width:820px){.layout{grid-template-columns:1fr;gap:8px}
 nav#nav{top:64px;z-index:5;display:flex;overflow-x:auto;scrollbar-width:none;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);margin-inline:-4px}
 nav#nav button{flex:none;white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:7px 14px}}
section{padding-top:20px;scroll-margin-top:80px}
section h2{font-size:26px;font-weight:700;display:flex;align-items:baseline;gap:10px}
section h2 small{font:500 13px var(--mono);color:var(--muted);letter-spacing:0}
.sub{color:var(--muted);margin:4px 0 16px;font-size:15px}
.list{display:grid;gap:12px;margin-bottom:24px}
.p{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:8px;min-width:0;transition:border-color .25s}
.p:hover{border-color:color-mix(in srgb,var(--mint) 45%,var(--line))}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ph h3{font-family:var(--body);letter-spacing:0;margin:0;font-size:16px;font-weight:600}
.num{font:500 12px var(--mono);color:var(--mint-ink);margin-right:8px;font-variant-numeric:tabular-nums}
.copy{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:500 13px var(--body);padding:6px 12px;border-radius:9px;cursor:pointer;transition:background .2s,border-color .2s}
.copy:hover{border-color:var(--mint)}
.copy.done{background:var(--mint);color:#fff;border-color:transparent}
.p p{margin:0;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg)}
</style>
</head>
<body>
<header class="site-head">
  <div class="container">
    <a class="brand" href="{{R}}" aria-label="AI Radar home"><svg viewBox="0 0 400 400" aria-hidden="true"><circle cx="200" cy="200" r="194" fill="#13a36b" stroke="#0f8a5a" stroke-width="8"/><g transform="translate(189 195) scale(0.74) translate(-224 -166)"><text x="182" y="285" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-weight="900" font-size="230" letter-spacing="-10" fill="#ffffff">a</text><rect x="268" y="160" width="40" height="125" rx="6" fill="#ffffff"/><circle cx="288" cy="112" r="24" fill="#1d1d1f"/><path d="M299.4 69.5 A44 44 0 0 1 330.5 100.6" stroke="#1d1d1f" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.85"/><path d="M305.1 48.2 A66 66 0 0 1 351.8 94.9" stroke="#1d1d1f" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.55"/></g></svg>AI Radar</a>
    <nav class="nav" aria-label="Main"><a class="hide-sm" href="{{R}}#resources">Resources</a><a class="hide-sm" href="{{R}}repos/">Repos</a><a class="hide-sm" href="{{R}}cheatsheets/">Cheatsheets</a><a class="hide-sm" href="{{R}}prompt-packs/" aria-current="page">Prompt packs</a><a class="btn btn-ink" href="https://x.com/ai_radar_">Follow on X</a></nav>
  </div>
</header>
<main class="container">
  <div class="page-head">
    <a class="crumb" href="{{R}}prompt-packs/">← All prompt packs</a>
    <span class="eyebrow">Free resource · Prompt pack</span>
    <h1>{{H1}}</h1>
    <p>{{LEDE}}</p>
    <ul class="how">{{HOW}}</ul>
  </div>
  <div class="layout">
    <nav id="nav" aria-label="Categories"></nav>
    <div id="main"></div>
  </div>
</main>
<footer class="site-foot">
  <div class="container">
    <span>© 2026 AI Radar</span>
    <nav aria-label="Footer"><a href="{{R}}repos/">Repos</a><a href="{{R}}cheatsheets/">Cheatsheets</a><a href="{{R}}prompt-packs/">Prompt packs</a><a href="https://x.com/ai_radar_">X / @ai_radar_</a></nav>
  </div>
</footer>
<script src="{{R}}assets/site.js?v=5" defer></script>
<script>
const PACK={{PACK}};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmt=s=>esc(s).replace(/\[([^\]]+)\]/g,'<mark>[$1]</mark>');
const nav=document.getElementById('nav'),main=document.getElementById('main');let n=0;
PACK.forEach(c=>{
  const b=document.createElement('button');b.type='button';b.id='nav-'+c.id;b.innerHTML=esc(c.name)+'<span style="font:500 12px var(--mono);opacity:.7">'+c.items.length+'</span>';b.setAttribute('aria-pressed','false');
  b.onclick=()=>document.getElementById(c.id).scrollIntoView();nav.appendChild(b);
  const s=document.createElement('section');s.id=c.id;
  s.innerHTML=`<h2>${esc(c.name)} <small>${c.items.length} prompts</small></h2><p class="sub">${esc(c.sub)}</p><div class="list"></div>`;
  const list=s.querySelector('.list');
  c.items.forEach(([t,body])=>{n++;
    const d=document.createElement('article');d.className='p';
    d.innerHTML=`<div class="ph"><h3><span class="num">${String(n).padStart(2,'0')}</span>${esc(t)}</h3><button type="button" class="copy" id="copy-${n}">Copy</button></div><p>${fmt(body)}</p>`;
    const btn=d.querySelector('.copy'),para=d.querySelector('p');
    btn.onclick=()=>{
      const ok=()=>{btn.textContent='Copied';btn.classList.add('done');setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('done')},1600)};
      const sel=()=>{const r=document.createRange();r.selectNodeContents(para);const w=getSelection();w.removeAllRanges();w.addRange(r);btn.textContent='Selected, press copy';};
      try{navigator.clipboard.writeText(body).then(ok,sel)}catch(e){sel()}
    };
    list.appendChild(d);});
  main.appendChild(s);
});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.id==='nav-'+e.target.id))}),{rootMargin:'-30% 0px -60% 0px'});
document.querySelectorAll('section').forEach(s=>io.observe(s));
</script>
<script src="{{R}}assets/chat.js?v=17" defer></script>
</body>
</html>
